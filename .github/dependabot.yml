version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      # Majors stay out of the group and get one PR each, so a breaking major can't block the rest.
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  # Dependabot's pip updater reads only *.txt/*.in files, so its PRs bump the bounds in requirements*.txt
  # (and the ruff pin) but never requirements-dev.lock. The `lock` CI job fails until the lock is
  # regenerated on the PR branch (see AGENTS.md).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Majors stay out of the group and get one PR each, so a breaking major can't block the rest.
      python-packages:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: deps
