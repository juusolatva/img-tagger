version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      # Majors stay out of the group and get one PR each, so a breaking major can't block the rest.
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  # pip is listed only to ignore it. Dependabot's pip updater reads only *.txt/*.in files, so its PRs
  # would bump requirements*.txt without regenerating requirements-dev.lock. `ignore` also applies to
  # security-update PRs; bump the lock by hand instead (see AGENTS.md).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
